name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
      notes:
        description: 'Release notes (one line summary)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version }}
      NOTES: ${{ github.event.inputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be in format vX.Y.Z"
            exit 1
          fi

      - name: Refuse to re-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release of an existing tag republishes that snapshot, including to the archive record.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; releases are never re-published."
            exit 1
          fi

      - name: Create or reuse tag
        run: |
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            git tag "${VERSION}"
          fi

      - name: Check release contents
        run: |
          NUMBER="${VERSION#v}"
          FAIL=0
          # Development memory belongs in the separate private memory repository, never in a release.
          if git ls-tree -r --name-only "${VERSION}" | grep -E '(^|/)\.(acm|trail)/' ; then
            echo "Tag ${VERSION} contains development memory (.acm/ or .trail/)."
            FAIL=1
          fi
          SPEC_V=$(git show "${VERSION}:SPEC.md" | sed -n 's/^\*\*Version:\*\* *\([0-9.]*\).*/\1/p' | head -n1)
          CFF_V=$(git show "${VERSION}:CITATION.cff" | sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' | head -n1)
          ZEN_V=$(git show "${VERSION}:.zenodo.json" | sed -n 's/^ *"version": *"\([0-9.]*\)".*/\1/p' | head -n1)
          for PAIR in "SPEC.md:${SPEC_V}" "CITATION.cff:${CFF_V}" ".zenodo.json:${ZEN_V}"; do
            if [ "${PAIR#*:}" != "${NUMBER}" ]; then
              echo "${PAIR%%:*} states version '${PAIR#*:}', expected ${NUMBER}."
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Push tag
        run: git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            --title "Agent Context Memory ${VERSION}" \
            --notes "${NOTES:-Release ${VERSION}}" \
            --generate-notes